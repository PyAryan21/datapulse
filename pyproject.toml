[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datapulse"
version = "0.1.0"
description = "Any data. Any format. Complete ML-grade analysis. Instantly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyAryan21" }]
keywords = ["data-analysis", "automl", "eda", "profiling", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
datapulse = "datapulse.cli:app"

[project.optional-dependencies]
core = [
    "polars[pyarrow]>=1.0",
    "duckdb>=1.0",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "shap>=0.44",
    "optuna>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "typer>=0.9",
    "rich>=13.7",
    "jinja2>=3.1",
    "nbformat>=5.9",
    "pdfplumber>=0.11",
    "pymupdf>=1.23",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "tabulate>=0.9",
]
delta = ["delta-rs[polars]>=0.18"]
iceberg = ["pyiceberg[polars]>=0.7"]
pdf = ["pdfplumber>=0.11", "pymupdf>=1.23"]
pdf_export = ["playwright>=1.44"]
timeseries = ["prophet>=1.1", "neuralforecast>=1.7"]
text = ["sentence-transformers>=3.0", "bertopic>=0.16"]
unstructured = ["openai-whisper>=20231117"]
all = [
    "delta-rs[polars]>=0.18",
    "pyiceberg[polars]>=0.7",
    "prophet>=1.1",
    "sentence-transformers>=3.0",
    "bertopic>=0.16",
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datapulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
